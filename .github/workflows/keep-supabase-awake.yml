# Supabase (plan gratuit) met le projet en pause après ~7 jours sans activité.
# Une requête tous les 3 jours suffit à le garder actif.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query tracks
        env:
          SUPABASE_URL: https://fudryxjtsbxqtqioecsz.supabase.co
          # Clé publishable : publique par nature (déjà dans le bundle web)
          SUPABASE_KEY: sb_publishable_4KzAEVXIT4EBdfECh4Zeuw_qSrEFKUL
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/tracks?select=id&limit=1"
